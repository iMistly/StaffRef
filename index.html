<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="script.js"></script>
    <link rel="stylesheet" href="style.css">
    <title>Staff Reference</title>
</head>
<body>
    <h1>Staff Reference</h1>
    <h2>Based on AniList</h2>
    <div id="search">
        <div class="search-side" id="ani1">
            <p>First Anime</p>
            <img class="cover" src="placeholder.jpg" alt="No Image">
            <input class="search-field" type="text" placeholder="One Piece">
            <div class="suggestions"></div>
        </div>
        <div class="search-side" id="ani2">
            <p>Second Anime</p>
            <img class="cover" src="placeholder.jpg" alt="No Image">
            <input class="search-field" type="text" placeholder="Bleach">
            <div class="suggestions"></div>
        </div>
    </div>
    <button type="button" id="search-button">Search</button>
    <div>
        <p id="result"></p>
    </div>
</body>
</html>
