<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Staff Reference</title>
    <meta name="description" content="Compare Anime Voice Actors">
    <!-- Script is deferred so that it executes after the page is loaded. -->
    <script src="script.js" defer></script>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
    <h1>Anime Staff Reference</h1>
    <h2>Powered by <a href="https://anilist.co" target="_blank">Anilist</a></h2>
    <p>This website caches data to reduce the number of API requests to Anilist.</p>
    <div id="primary-search">
        <div class="search-side">
            <div class="cover"></div>
            <input id="a-search-1" type="text" placeholder="Anime Title #1">
            <div class="notice"></div>
            <div class="suggestions"></div>
        </div>
        <div class="search-side">
            <div class="cover"></div>
            <input id="a-search-2" type="text" placeholder="Anime Title #2">
            <div class="notice"></div>
            <div class="suggestions"></div>
        </div>
    </div>
    <button id="compare-button" type="submit" title="Compare both animes.">Compare</button>
    <div id="results"></div>
    <div>
        <p>Anime not showing all the characters? Clear the cache to force API calls again.</p>
        <button id="clear-cache" type="button" onclick="localStorage.clear()" title="Removes all cache from storage.">Clear all cache</button>
    </div>
</body>
</html>
